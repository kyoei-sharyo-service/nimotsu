<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>積載車の荷扱い</title>
<meta name="kyoei-page" content="steps">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 新人ノートの試作：上に横から見たトラックの図（手順ごとに動く）、下に手順のカード。段階のタブで飛べる */
:root {
  --bg: #EEF1EA;
  --surface: #FFFFFF;
  --fg: #141A12;
  --muted: #5B6455;
  --line: #D3D9CD;
  --accent: #0B7A0B;
  --accent-soft: #DDEFD9;
  --danger: #C62828;
  --danger-soft: #FBE3E1;
  --truck: #2B3128;
  --truck-2: #4A5245;
  --deck: #7C8676;
  --car-a: #3B6FB6;
  --car-b: #B5652A;
  --wire: #E0A100;
  --green: #4FB82B;
  --green-dark: #2F7D17;
  --glass: #24302C;
  --mesh: #8A9384;
  --ground: #C3C9BC;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111410; --surface: #1B1F19; --fg: #EDF2E8; --muted: #9AA391; --line: #2F362C;
    --accent: #42E642; --accent-soft: #1E3A1E; --danger: #FF6B5E; --danger-soft: #3A1B18;
    --truck: #C9D1C2; --truck-2: #8E978A; --deck: #6E7869; --car-a: #6E9EE0; --car-b: #E39456;
    --wire: #FFC83D; --ground: #3A4136; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111410; --surface: #1B1F19; --fg: #EDF2E8; --muted: #9AA391; --line: #2F362C;
  --accent: #42E642; --accent-soft: #1E3A1E; --danger: #FF6B5E; --danger-soft: #3A1B18;
  --truck: #C9D1C2; --truck-2: #8E978A; --deck: #6E7869; --car-a: #6E9EE0; --car-b: #E39456;
  --wire: #FFC83D; --ground: #3A4136; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* ボタンやスイッチの近くをダブルタップしても拡大しない（アプリの部品のように動く） */
html, body, button, input, label, .chip, .btn, .tab { touch-action: manipulation; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
h1 { font-size: clamp(24px, 6vw, 32px); line-height: 1.25; margin: 0; font-weight: 900; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 14px; }
h2 { font-size: 20px; margin: 0; font-weight: 900; text-wrap: balance; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 10px 12px 12px; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.mode { display: flex; gap: 6px; }
/* 緊締を試す：スクロールなしで全部の操作が収まるように、詰めた並び */
.compact { padding: 10px 12px; gap: 6px; }
.lrow { display: grid; grid-template-columns: 7.3em 1fr; gap: 6px; align-items: center; }
.lk { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.compact .chip { font-size: 12px; padding: 5px 9px; }
.compact .chips { gap: 5px; }
.compact .btn { font-size: 13px; padding: 7px 12px; }
body.simmode header, body.simmode .lead { display: none; }
body.fixedpage.simmode .compact .chip { font-size: 11px; padding: 4px 7px; }
body.fixedpage.simmode .lrow { grid-template-columns: 5.6em 1fr; gap: 4px; }
body.fixedpage.simmode .lk { font-size: 10px; }
body.fixedpage.simmode .vbox { height: 100px; }
body.fixedpage.simmode .vbox input { width: 100px; }
body.fixedpage.simmode .compact { gap: 4px; padding: 8px 10px; }
body.fixedpage.simmode .wrap { gap: 8px; }
body.fixedpage { padding-block: 8px 24px; }
/* 緊締を試す（アプリ・Web の「緊締について」）：ゲームの画面のように、画面にぴったり収めてスクロールさせない。
   図が残りの高さいっぱいに伸び縮みし、操作は下に固定。縦スライダーを動かしてもページが動かない（2026-10-16 本人） */
html:has(body.fixedpage.simmode), body.fixedpage.simmode { height: 100%; overflow: hidden; overscroll-behavior: none; }
body.fixedpage.simmode { padding-block: 4px 0; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
/* 上：結果の文（高さ固定。文が変わっても下が動かない）＋図（横幅いっぱい・縦横比どおり）。下：操作（残りの高さいっぱい、大きいボタン）（本人 10/16） */
body.fixedpage.simmode .wrap { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; width: 100%; }
body.fixedpage.simmode .stage { position: static; box-shadow: none; display: grid; gap: 0; background: transparent; border-color: transparent; padding: 0 2px; }
body.fixedpage.simmode .diagram { width: 100%; height: auto; display: block; overflow: visible; }   /* 上段を高く上げたときは文の欄の下まで車がはみ出してよい */
body.fixedpage.simmode .simmsg p { text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg); }   /* 上段を高く上げた車に重なっても読めるように */
body.fixedpage.simmode .simmsg { height: 60px; position: relative; z-index: 1; min-height: 0; overflow: hidden; justify-content: flex-start; padding-top: 0; gap: 0; }
body.fixedpage.simmode .simmsg .why { font-size: 12px; }
body.fixedpage.simmode .simmsg .res { font-size: 14px; line-height: 1.3; }
body.fixedpage.simmode .simmsg .res:empty { display: none; }
body.fixedpage.simmode .compact { min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 8px; }
body.fixedpage.simmode .lrow { grid-template-columns: 3.6em 1fr; gap: 4px; }
body.fixedpage.simmode .lk { font-size: 11px; white-space: normal; line-height: 1.2; }
body.fixedpage.simmode .compact .chips { gap: 4px; flex-wrap: nowrap; }
body.fixedpage.simmode .compact .chip { font-size: 13.5px; padding: 6px 0; min-height: 36px; flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; letter-spacing: -.02em; border-radius: 12px; }
body.fixedpage.simmode #lowToggle { flex: 0 1 auto; padding: 9px 16px; }
body.fixedpage.simmode .compact .btn { font-size: 14px; padding: 12px 14px; border-radius: 14px; white-space: nowrap; }
body.fixedpage.simmode .vrow { flex: 1 1 0; min-height: 120px; align-items: stretch; padding-top: 2px; }
body.fixedpage.simmode .vslider { width: 64px; font-size: 12px; gap: 4px; grid-template-rows: 1fr auto; }
body.fixedpage.simmode .vbox { width: 64px; height: auto; min-height: 0; overflow: visible; }
body.fixedpage.simmode .vbox input { width: var(--vlen, 100px); height: 56px; }
body.fixedpage.simmode #simAgain { align-self: center; }
body.fixedpage.simmode input[type=range] { touch-action: none; }
/* 小さい画面（横 380 以下、または縦 760 以下＝アプリの中の表示はだいたいこれ）では操作を詰めて、図に高さを残す */

body.simmode .wrap { gap: 10px; }
body.simmode .stage { padding: 8px 8px 8px; }
/* 緊締を試す：結果の文（図の上。読める大きさで） */
.simmsg { display: flex; flex-direction: column; gap: 2px; text-align: center; line-height: 1.35; padding: 2px 4px 0; min-height: 4.2em; justify-content: flex-end; }
.simmsg p { margin: 0; }
.simmsg .why { font-size: 13px; font-weight: 700; color: var(--muted); }
.simmsg .res { white-space: pre-line; font-size: 17px; font-weight: 900; color: var(--accent); }
.simmsg .res.bad { color: var(--danger); }
.simmsg .res:empty { display: none; }
.vrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 4px; }
.vslider { display: grid; justify-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); width: 44px; flex: none; }
.vbox { position: relative; width: 44px; height: 140px; }
.vbox input { position: absolute; left: 50%; top: 50%; width: 140px; height: 44px; margin: 0; transform: translate(-50%, -50%) rotate(-90deg); accent-color: var(--accent); }
.mode .tab { flex: 1; text-align: center; padding: 9px 12px; font-size: 14px; }
.tab { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.diagram { width: 100%; height: auto; display: block; }
/* 図を上に貼り付けるのは画面が高いときだけ。アプリの中と背の低い画面では、ページ全体をふつうにスクロールする（図の下が狭くなるため。10/17 本人） */
body.fixedpage:not(.simmode) .stage { position: static; }
@media (max-height: 820px) { body:not(.simmode) .stage { position: static; } }
/* アプリの中（手順）：戻るの丸ボタン（矢印だけ）が左上に重なるので、段階のタブを右へずらす */
body.fixedpage:not(.simmode) .tabs { padding-left: 40px; }
/* 手順のカードの続きが画面の外にあるとき、下に出す（文が画面の端でちょうど切れると、続きに気付かないため。10/17 本人） */
.more { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20;
        font: inherit; font-size: 14px; font-weight: 900; padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer;
        background: var(--accent); color: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .more { animation: morebob 1.6s ease-in-out infinite; } }
@keyframes morebob { 50% { transform: translateX(-50%) translateY(4px); } }
/* 図の左右が前・後ろ（図の中の文字はスマホでは小さすぎるので、図の外に） */
.ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: -4px; }
body.simmode .ends { display: none; }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.card { display: grid; gap: 10px; }
.stepno { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.card h3 { margin: 0; font-size: 19px; font-weight: 900; line-height: 1.4; text-wrap: balance; }
.card p { margin: 0; }
.where { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.where b { color: var(--fg); }
.warn { border-left: 4px solid var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; }
.warn strong { color: var(--danger); }
.tip { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding-top: 2px; }
.btn { font: inherit; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.demo { display: flex; gap: 8px; flex-wrap: wrap; }
/* ボタンが 2 つのとき（前後を少しずつ上げる／後ろだけ上げると？ など）は、折り返さず左右に半分ずつ（10/17 本人） */
.demo:has(> :nth-child(2)) { display: grid; grid-template-columns: 1fr 1fr; }
.demo:has(> :nth-child(2)) .btn { padding: 8px 6px; text-align: center; line-height: 1.35; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini { max-width: 220px; margin: 0 auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.result { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 9em 1fr 3.5em; gap: 8px; align-items: center; font-size: 13px; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; transition: width .4s; }
.lv { font-weight: 700; text-align: right; }
.note { font-size: 12px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .progress i, .bar i { transition: none; } }
/* 上段・下段の緊締の切りかえ（左右スワイプ） */
.ltabs { display: flex; gap: 4px; }
.ltab { flex: 1; font: inherit; font-size: 13px; font-weight: 800; padding: 6px 0; border: 0; border-bottom: 3px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.ltab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.lpages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; touch-action: pan-x; }
.lpages::-webkit-scrollbar { display: none; }
.lpage { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; display: grid; gap: 6px; align-content: start; }
.chip.ev { background: var(--surface); border-color: var(--fg); }
.chip.ev.bad { border-color: var(--danger); color: var(--danger); }
.chip.ev:disabled { opacity: .4; }
.chip.sb { white-space: pre-line !important; line-height: 1.1; font-size: 12px !important; }
.chip.sb[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.zoomov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.zoombox { width: min(440px, 100%); background: var(--surface); border-radius: 16px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.zoomhd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
.zoomhd .btn { padding: 6px 12px; font-size: 13px; }
.zoomsvg { width: 100%; aspect-ratio: 240 / 150; background: var(--bg); border-radius: 12px; display: block; }
.zoommsg { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; color: var(--accent); }
.zoommsg.bad { color: var(--danger); }
/* 「なぜこれが〇〇なの？」（押すと、小学生でも分かる説明が開く） */
.zoomwhy { justify-self: start; font: inherit; font-size: 14px; font-weight: 900; color: var(--danger); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 2px 0; cursor: pointer; }
.zoomexp { margin: 0; font-size: 13px; line-height: 1.65; background: var(--danger-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.zoomexp p { margin: 0; }
.zoombtns { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zoombtns .chip { font-size: 15px; padding: 12px 0; text-align: center; }
[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">新人ノート ・ 荷扱い</div>
    <h1>積載車の荷扱い</h1>
    <p class="lead">2 段の積載車に、上段・下段の順で車を積むまでの流れです。図は助手席側（左）から見たところで、手順ごとに動きます。</p>
  </header>

  <div class="mode" role="tablist" aria-label="画面">
    <button class="tab" type="button" role="tab" id="modeSteps" aria-selected="true">手順</button>
    <button class="tab" type="button" role="tab" id="modeSim" aria-selected="false">緊締を試す</button>
  </div>

  <section class="panel stage" aria-label="トラックの図">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="simmsg" id="simMsg" hidden aria-live="polite"><p class="why" id="simWhy"></p><p class="res" id="simRes1"></p><p class="res" id="simRes2"></p></div>
    <svg class="diagram" id="truck" viewBox="0 110 2000 702" preserveAspectRatio="xMidYMid meet" role="img" aria-label="トラックを助手席側（左）から見た図。左が運転席、右が後ろ"></svg>
    <div class="ends" aria-hidden="true"><span>← 前（運転席）</span><span>後ろ →</span></div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="nav">
      <button class="btn" id="prev" type="button">← 前へ</button>
      <span class="count" id="count"></span>
      <button class="btn primary" id="next" type="button">次へ →</button>
    </div>
  </section>

  <section class="panel card" id="card" aria-live="polite"></section>
  <button class="more" type="button" id="more" hidden>↓ 下に続きがあります</button>
  <section class="panel compact" id="simControls" aria-label="緊締を試す" hidden>
    <!-- 上段の緊締・下段の緊締は左右にスワイプして切りかえる（本人 10/16） -->
    <div class="ltabs" role="tablist" aria-label="緊締する車"><button class="ltab" type="button" role="tab" id="ltabUp" aria-selected="true">上段の車</button><button class="ltab" type="button" role="tab" id="ltabLow" aria-selected="false">下段の車</button></div>
    <div class="lpages" id="lpages">
      <div class="lpage" aria-label="上段の車の緊締">
        <div class="lrow"><span class="lk">キャビン側</span><div class="chips" id="lashF"></div></div>
        <div class="lrow"><span class="lk">ゲート側</span><div class="chips" id="lashR"></div></div>
        <div class="lrow"><span class="lk">シフト</span><div class="chips" id="shiftUp"></div></div>
      </div>
      <div class="lpage" aria-label="下段の車の緊締">
        <div class="lrow"><span class="lk">下段</span><div class="chips"><button class="chip" type="button" id="lowToggle" aria-pressed="false">下段に車を積む</button></div></div>
        <div class="lrow lowrow" hidden><span class="lk">キャビン側</span><div class="chips" id="lashLF"></div></div>
        <div class="lrow lowrow" hidden><span class="lk">ゲート側</span><div class="chips" id="lashLR"></div></div>
        <div class="lrow lowrow" hidden><span class="lk">シフト</span><div class="chips" id="shiftLow"></div></div>
      </div>
    </div>
    <div class="lrow"><span class="lk">走る</span><div class="chips"><button class="chip" type="button" id="roadRough" aria-pressed="false">悪路</button><button class="chip ev" type="button" id="simBrake">急ブレーキ</button><button class="chip ev bad" type="button" id="simCrash">衝突</button></div></div>
    <div class="vrow">
      <div class="vslider" id="vsF"><div class="vbox"><input type="range" id="simFront" min="0" max="100" value="50" aria-label="上段フロアのキャビン側の高さ"></div><span>キャビン側</span></div>
      <button class="btn" type="button" id="simAgain">車を元の位置に戻す</button>
      <div class="vslider" id="vsR"><div class="vbox"><input type="range" id="simRear" min="0" max="100" value="95" aria-label="上段フロアのゲート側の高さ"></div><span>ゲート側</span></div>
    </div>
  </section>
</div>

<script>
// 会社の積載車のイラスト（2026-10-16 本人）から、動かない部分だけを切り出して背景を透明にしたもの（art/cut.swift）
const BASE_IMG = 'nimotsu-truck.png';
// 本人の車の絵から切り出したプロボックス（右が前）とレクサス IS（左が前）（art/carcut2.swift）
const PROBOX_IMG = 'nimotsu-probox.png';
const IS_IMG = 'nimotsu-is.png';
for (const u of [BASE_IMG, PROBOX_IMG, IS_IMG]) { const im = new Image(); im.src = u; }
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ── 手順 ──

        if (d < L0 - 3) { const mx = (w.x + h.x) / 2, my = Math.max(w.y, h.y) + (L0 - d) * .9; el('path', { d: `M${w.x},${w.y} Q${mx},${my} ${h.x},${h.y}`, fill: 'none', stroke: C.wire, 'stroke-width': 4, opacity: .55, 'stroke-linecap': 'round' }, svg); }
        else el('line', { x1: w.x, y1: w.y, x2: h.x, y2: h.y, stroke: C.wire, 'stroke-width': 4, 'stroke-linecap': 'round' }, svg);
        el('circle', { cx: h.x, cy: h.y, r: 4.5, fill: C.wire }, svg);
      }
    });
  }
  function simWiresLow(svg, g, car) {
    const C = { wire: css('--wire') };
    const wheels = car.hooks.slice().sort((a, b) => a.x - b.x);
    const pose = lowCarPose(g, 0, car.wbPx);
    [lash.LF, lash.LR].forEach((k, i) => {
      const hl = car.hookLocal[i], bx = LOW_X + hl.along * Math.cos(pose.ang);
      const w0 = { x: bx, y: lowerFloorY(bx, g) - 4 - hl.up };
      for (const off of HOOK[k]) {
        const hx = bx + off, h = { x: hx, y: lowerFloorY(hx, g) };
        const w = wheels[i];
        const L0 = Math.hypot(h.x - w0.x, h.y - w0.y) + 2, d = Math.hypot(h.x - w.x, h.y - w.y);
        if (d < L0 - 3) { const mx = (w.x + h.x) / 2, my = Math.max(w.y, h.y) + (L0 - d) * .9; el('path', { d: `M${w.x},${w.y} Q${mx},${my} ${h.x},${h.y}`, fill: 'none', stroke: C.wire, 'stroke-width': 4, opacity: .55, 'stroke-linecap': 'round' }, svg); }
        else el('line', { x1: w.x, y1: w.y, x2: h.x, y2: h.y, stroke: C.wire, 'stroke-width': 4, 'stroke-linecap': 'round' }, svg);
        el('circle', { cx: h.x, cy: h.y, r: 4.5, fill: C.wire }, svg);
      }
    });
  }
  function chips(id, list, get, set) {
    const box = document.getElementById(id);
    list.forEach(x => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = x.n; b.onclick = () => { set(x); simTouched(); [...box.children].forEach((c, i) => c.setAttribute('aria-pressed', list[i] === get() ? 'true' : 'false')); }; box.appendChild(b); });
    [...box.children].forEach((c, i) => c.setAttribute('aria-pressed', list[i] === get() ? 'true' : 'false'));
  }
  chips('lashF', LASH, () => LASH.find(x => x.k === lash.F), x => { lash.F = x.k; });
  chips('lashR', LASH, () => LASH.find(x => x.k === lash.R), x => { lash.R = x.k; });
  chips('lashLF', LASH, () => LASH.find(x => x.k === lash.LF), x => { lash.LF = x.k; });
  chips('lashLR', LASH, () => LASH.find(x => x.k === lash.LR), x => { lash.LR = x.k; });
  chips('shiftUp', SHIFT, () => SHIFT.find(x => x.k === shift.up), x => { shift.up = x.k; });
  chips('shiftLow', SHIFT, () => SHIFT.find(x => x.k === shift.low), x => { shift.low = x.k; });
  // サイドブレーキはシフトの横の切りかえ（P と N とは別に選ぶ）
  for (const [id, k] of [['shiftUp', 'up'], ['shiftLow', 'low']]) {
    const b = document.createElement('button'); b.className = 'chip sb'; b.type = 'button';
    const show = () => { b.setAttribute('aria-pressed', sideBrake[k] ? 'true' : 'false'); b.textContent = 'サイド\nブレーキ'; };
    b.onclick = () => { simTouched(); sideBrake[k] = !sideBrake[k]; show(); }; show(); document.getElementById(id).appendChild(b);
  }
  { const b = document.getElementById('roadRough'); b.onclick = () => { simTouched(); road = road.k === 'rough' ? ROAD[0] : ROAD[1]; b.setAttribute('aria-pressed', road.k === 'rough' ? 'true' : 'false'); }; }
  document.getElementById('simBrake').onclick = () => { if (simState) { simState.ev = { k: 'brake', t0: (performance.now() - simState.t0) / 1000 }; setEventButtons(); } };
  document.getElementById('simCrash').onclick = () => { if (simState) { simState.ev = { k: 'crash', t0: (performance.now() - simState.t0) / 1000 }; setEventButtons(); } };
  // 上段・下段の緊締：タブを押すか、左右にスワイプして切りかえる
  { const pages = document.getElementById('lpages'), tabs = [document.getElementById('ltabUp'), document.getElementById('ltabLow')];
    const mark = i => tabs.forEach((t, k) => t.setAttribute('aria-selected', k === i ? 'true' : 'false'));
    tabs.forEach((t, i) => t.onclick = () => { pages.scrollTo({ left: i * pages.clientWidth, behavior: 'smooth' }); mark(i); });
    pages.addEventListener('scroll', () => mark(Math.round(pages.scrollLeft / Math.max(1, pages.clientWidth)))); }
  document.getElementById('lowToggle').onclick = e => {
    lowOn = !lowOn; e.target.setAttribute('aria-pressed', lowOn ? 'true' : 'false'); e.target.textContent = lowOn ? '下段の車を下ろす' : '下段に車を積む';
    for (const el2 of document.querySelectorAll('.lowrow')) el2.hidden = !lowOn;
    if (simState) simState.low = newBody();
  };
  // 何か操作したら、急ブレーキ・衝突の結果の表示をやめて、いまの判定に戻す
  function simTouched() { if (simState && simState.ev && simState.ev.done) { simState.ev = null; simState.msgHold = {}; } }
  // フロアを動かしたら、当たったの判定は消す（車はその場から続く）
  function floorTouched() {
    if (!simState) return;
    simTouched();
    if (simState.up.hit !== 'cab' || true) simState.up.hit = false; simState.low.hit = false;
  }
  document.getElementById('simAgain').onclick = resetSim;
  document.getElementById('simFront').oninput = e => { simF = e.target.value / 100; floorTouched(); };
  document.getElementById('simRear').oninput = e => { simR = e.target.value / 100; floorTouched(); };

  go(0);

  // ── 下に続きがあるときの知らせ ──
  const more = document.getElementById('more');
  function updateMore() {
    const card = document.getElementById('card');
    const hidden = document.body.classList.contains('simmode') || card.hidden || card.getBoundingClientRect().bottom <= innerHeight - 8;
    more.hidden = hidden;
  }
  more.onclick = () => { const r = document.getElementById('card').getBoundingClientRect(); scrollBy({ top: r.bottom - innerHeight + 24, behavior: reduce ? 'auto' : 'smooth' }); };
  addEventListener('scroll', updateMore, { passive: true });
  addEventListener('resize', updateMore);
  new ResizeObserver(updateMore).observe(document.getElementById('card'));
  updateMore();
  // 手順と「緊締を試す」の切り替え（上下に並べると見にくいので別の画面に）
  function setMode(m) {
    const simOn = m === 'sim';
    simMode = simOn;
    document.getElementById('modeSteps').setAttribute('aria-selected', simOn ? 'false' : 'true');
    document.getElementById('modeSim').setAttribute('aria-selected', simOn ? 'true' : 'false');
    for (const id of ['card', 'tabs']) document.getElementById(id).hidden = simOn;
    document.getElementById('simMsg').hidden = !simOn;
    document.getElementById('truck').setAttribute('viewBox', simOn ? '0 205 1480 607' : '0 110 2000 702');
    document.querySelector('.stage .progress').hidden = simOn;
    document.querySelector('.stage .nav').hidden = simOn;
    document.getElementById('simControls').hidden = !simOn;
    document.body.classList.toggle('simmode', simOn);
    if (simOn) resetSim(); else { cancelAnimationFrame(simAnim); simState = null; simView = null; go(idx); }
    if (!document.body.classList.contains('fixedpage')) { try { localStorage.setItem('nimotsu.mode', m); } catch (e) {} }
  }
  document.getElementById('modeSteps').onclick = () => setMode('steps');
  document.getElementById('modeSim').onclick = () => setMode('sim');
  // アプリに入れるときは、ページごとに決め打ち（<meta name="kyoei-page" content="steps|sim">）。切り替えと見出しは出さない
  const fixedPage = document.querySelector('meta[name="kyoei-page"]')?.content;
  if (fixedPage) { document.querySelector('.mode').hidden = true; document.body.classList.add('fixedpage'); setMode(fixedPage); }
  else { try { if (localStorage.getItem('nimotsu.mode') === 'sim') setMode('sim'); } catch (e) {} }
  // 縦スライダーは空いている高さいっぱいの長さに（下段の行が増えると短くなる）
  { const fit = () => { for (const id of ['simFront', 'simRear']) { const box = document.getElementById(id).parentElement; const h = box.getBoundingClientRect().height; if (h > 0) box.style.setProperty('--vlen', Math.round(h) + 'px'); } };
    try { const ro = new ResizeObserver(fit); for (const id of ['simFront', 'simRear']) ro.observe(document.getElementById(id).parentElement); } catch (e) {} addEventListener('resize', fit); setTimeout(fit, 50); }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
