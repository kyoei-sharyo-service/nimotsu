<style>
/* 新人ノートの試作：上に横から見たトラックの図（手順ごとに動く）、下に手順のカード。段階のタブで飛べる */
:root {
  --bg: #EEF1EA;
  --surface: #FFFFFF;
  --fg: #141A12;
  --muted: #5B6455;
  --line: #D3D9CD;
  --accent: #0B7A0B;
  --accent-soft: #DDEFD9;
  --danger: #C62828;
  --danger-soft: #FBE3E1;
  --truck: #2B3128;
  --truck-2: #4A5245;
  --deck: #7C8676;
  --car-a: #3B6FB6;
  --car-b: #B5652A;
  --wire: #E0A100;
  --green: #4FB82B;
  --green-dark: #2F7D17;
  --glass: #24302C;
  --mesh: #8A9384;
  --ground: #C3C9BC;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111410; --surface: #1B1F19; --fg: #EDF2E8; --muted: #9AA391; --line: #2F362C;
    --accent: #42E642; --accent-soft: #1E3A1E; --danger: #FF6B5E; --danger-soft: #3A1B18;
    --truck: #C9D1C2; --truck-2: #8E978A; --deck: #6E7869; --car-a: #6E9EE0; --car-b: #E39456;
    --wire: #FFC83D; --ground: #3A4136; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111410; --surface: #1B1F19; --fg: #EDF2E8; --muted: #9AA391; --line: #2F362C;
  --accent: #42E642; --accent-soft: #1E3A1E; --danger: #FF6B5E; --danger-soft: #3A1B18;
  --truck: #C9D1C2; --truck-2: #8E978A; --deck: #6E7869; --car-a: #6E9EE0; --car-b: #E39456;
  --wire: #FFC83D; --ground: #3A4136; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* ボタンやスイッチの近くをダブルタップしても拡大しない（アプリの部品のように動く） */
html, body, button, input, label, .chip, .btn, .tab { touch-action: manipulation; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.75;
  line-break: strict;   /* 「ワイヤ／ー」「ショ／ン」のように、伸ばす音や小さい文字の前で折り返さない */
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
h1 { font-size: clamp(24px, 6vw, 32px); line-height: 1.25; margin: 0; font-weight: 900; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 14px; }
h2 { font-size: 20px; margin: 0; font-weight: 900; text-wrap: balance; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 10px 12px 12px; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.mode { display: flex; gap: 6px; }
/* 緊締を試す：スクロールなしで全部の操作が収まるように、詰めた並び */
.compact { padding: 10px 12px; gap: 6px; }
.lrow { display: grid; grid-template-columns: 7.3em 1fr; gap: 6px; align-items: center; }
.lk { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.compact .chip { font-size: 12px; padding: 5px 9px; }
.compact .chips { gap: 5px; }
.compact .btn { font-size: 13px; padding: 7px 12px; }
body.simmode header, body.simmode .lead { display: none; }
body.fixedpage.simmode .vbox { height: 100px; }
body.fixedpage.simmode .vbox input { width: 100px; }
body.fixedpage.simmode .compact { gap: 4px; padding: 8px 10px; }
body.fixedpage.simmode .wrap { gap: 8px; }
body.fixedpage { padding-block: 8px 24px; }
/* 緊締を試す（アプリ・Web の「緊締について」）：ゲームの画面のように、画面にぴったり収めてスクロールさせない。
   図が残りの高さいっぱいに伸び縮みし、操作は下に固定。縦スライダーを動かしてもページが動かない（2026-10-16 本人） */
html:has(body.fixedpage.simmode), body.fixedpage.simmode { height: 100%; overflow: hidden; overscroll-behavior: none; }
body.fixedpage.simmode { margin: 0; padding-block: 4px 0; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
/* 上：結果の文（高さ固定。文が変わっても下が動かない）＋図（横幅いっぱい・縦横比どおり）。下：操作（残りの高さいっぱい、大きいボタン）（本人 10/16） */
body.fixedpage.simmode .wrap { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; width: 100%; }
body.fixedpage.simmode .stage { position: static; box-shadow: none; display: grid; gap: 0; background: transparent; border-color: transparent; padding: 0 2px; }
body.fixedpage.simmode .diagram { width: 100%; height: auto; display: block; overflow: visible; }   /* 上段を高く上げたときは文の欄の下まで車がはみ出してよい */
body.fixedpage.simmode .simmsg p { text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg); }   /* 上段を高く上げた車に重なっても読めるように */
body.fixedpage.simmode .simmsg { height: 60px; position: relative; z-index: 1; min-height: 0; overflow: hidden; justify-content: flex-start; padding-top: 0; gap: 0; }
body.fixedpage.simmode .simmsg .why { font-size: 12px; }
body.fixedpage.simmode .simmsg .res { font-size: 14px; line-height: 1.3; }
body.fixedpage.simmode .simmsg .res:empty { display: none; }
body.fixedpage.simmode .compact { min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 8px; }
body.simmode .lrow { grid-template-columns: 3.6em minmax(0, 1fr); gap: 4px; }
body.simmode .lk { font-size: 11px; white-space: normal; line-height: 1.2; }
body.simmode .compact .chips { gap: 4px; flex-wrap: nowrap; }
body.simmode .compact .chip { font-size: 13.5px; padding: 6px 0; min-height: 36px; flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; letter-spacing: -.02em; border-radius: 12px; }
body.simmode #lowToggle { flex: 0 1 auto; padding: 9px 16px; }
body.fixedpage.simmode .compact .btn { font-size: 14px; padding: 12px 14px; border-radius: 14px; white-space: nowrap; }
body.fixedpage.simmode .vrow { flex: 1 1 0; min-height: 120px; align-items: stretch; padding-top: 2px; }
body.fixedpage.simmode .vslider { width: 64px; font-size: 12px; gap: 4px; grid-template-rows: 1fr auto; }
body.fixedpage.simmode .vbox { width: 64px; height: auto; min-height: 0; overflow: visible; }
body.fixedpage.simmode .vbox input { width: var(--vlen, 100px); height: 56px; }
body.fixedpage.simmode #simAgain { align-self: center; }
body.fixedpage.simmode input[type=range] { touch-action: none; }
/* 小さい画面（横 380 以下、または縦 760 以下＝アプリの中の表示はだいたいこれ）では操作を詰めて、図に高さを残す */

body.simmode .wrap { gap: 10px; }
body.simmode .stage { padding: 8px 8px 8px; }
/* 緊締を試す：結果の文（図の上。読める大きさで） */
.simmsg { display: flex; flex-direction: column; gap: 2px; text-align: center; line-height: 1.35; padding: 2px 4px 0; min-height: 4.2em; justify-content: flex-end; }
.simmsg p { margin: 0; }
/* 結果の文：言葉の切れ目（、。！？）の後ろと（の前）でだけ折り返す（「効い／ている」のように切れないように。10/19 本人） */
.ph { display: inline-block; max-width: 100%; }
.simmsg .why { font-size: 13px; font-weight: 700; color: var(--muted); }
.simmsg .res { white-space: pre-line; font-size: 17px; font-weight: 900; color: var(--accent); }
.simmsg .res.bad { color: var(--danger); }
.simmsg .res:empty { display: none; }
.vrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 4px; }
.vslider { display: grid; justify-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); width: 44px; flex: none; }
.vbox { position: relative; width: 44px; height: 140px; }
.vbox input { position: absolute; left: 50%; top: 50%; width: 140px; height: 44px; margin: 0; transform: translate(-50%, -50%) rotate(-90deg); accent-color: var(--accent); }
.mode .tab { flex: 1; text-align: center; padding: 9px 6px; font-size: 14px; white-space: nowrap; }
.tab { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.diagram { width: 100%; height: auto; display: block; }
/* 図を上に貼り付けるのは画面が高いときだけ。アプリの中と背の低い画面では、ページ全体をふつうにスクロールする（図の下が狭くなるため。10/17 本人） */
body.fixedpage:not(.simmode) .stage { position: static; }
@media (max-height: 820px) { body:not(.simmode) .stage { position: static; } }
/* アプリの中（手順）：戻るの丸ボタン（矢印だけ）が左上に重なるので、段階のタブを右へずらす */
body.fixedpage:not(.simmode) .tabs { padding-left: 40px; }
/* 手順のカードの続きが画面の外にあるとき、下に出す（文が画面の端でちょうど切れると、続きに気付かないため。10/17 本人） */
.more { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20;
        font: inherit; font-size: 14px; font-weight: 900; padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer;
        background: var(--accent); color: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .more { animation: morebob 1.6s ease-in-out infinite; } }
@keyframes morebob { 50% { transform: translateX(-50%) translateY(4px); } }
/* 図の左右が前・後ろ（図の中の文字はスマホでは小さすぎるので、図の外に） */
.ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: -4px; }
body.simmode .ends { display: none; }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.card { display: grid; gap: 10px; }
.stepno { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.card h3 { margin: 0; font-size: 19px; font-weight: 900; line-height: 1.4; text-wrap: balance; }
.card p { margin: 0; }
.where { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.where b { color: var(--fg); }
.warn { border-left: 4px solid var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; }
.warn strong { color: var(--danger); }
.tip { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding-top: 2px; }
.btn { font: inherit; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.demo { display: flex; gap: 8px; flex-wrap: wrap; }
/* ボタンが 2 つのとき（前後を少しずつ上げる／後ろだけ上げると？ など）は、折り返さず左右に半分ずつ（10/17 本人） */
.demo:has(> :nth-child(2)) { display: grid; grid-template-columns: 1fr 1fr; }
.demo:has(> :nth-child(2)) .btn { padding: 8px 6px; text-align: center; line-height: 1.35; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini { max-width: 220px; margin: 0 auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.result { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 9em 1fr 3.5em; gap: 8px; align-items: center; font-size: 13px; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; transition: width .4s; }
.lv { font-weight: 700; text-align: right; }
.note { font-size: 12px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .progress i, .bar i { transition: none; } }
/* 上段・下段の緊締の切りかえ（左右スワイプ） */
.ltabs { display: flex; gap: 4px; }
.ltab { flex: 1; font: inherit; font-size: 13px; font-weight: 800; padding: 6px 0; border: 0; border-bottom: 3px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.ltab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.lpages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; touch-action: pan-x; }
.lpages::-webkit-scrollbar { display: none; }
.lpage { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; display: grid; gap: 6px; align-content: start; }
.chip.ev { background: var(--surface); border-color: var(--fg); }
.chip.ev.bad { border-color: var(--danger); color: var(--danger); }
.chip.ev:disabled { opacity: .4; }
.chip.sb { white-space: pre-line !important; line-height: 1.1; font-size: 12px !important; }
.chip.sb[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.zoomov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.zoombox { width: min(440px, 100%); background: var(--surface); border-radius: 16px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.zoomhd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
.zoomhd .btn { padding: 6px 12px; font-size: 13px; }

.zoommsg { white-space: pre-line; margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; color: var(--accent); }
.zoommsg.bad { color: var(--danger); }
/* 「なぜこれが〇〇なの？」（押すと、小学生でも分かる説明が開く） */
.zoomwhy { justify-self: start; font: inherit; font-size: 14px; font-weight: 900; color: var(--danger); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 2px 0; cursor: pointer; }

.zoombtns { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zoombtns .chip { font-size: 15px; padding: 12px 0; text-align: center; }
.zoombox { max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }
/* ── タイヤ固縛（2026-10-19）── */

        padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.texpin { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }

/* 視点の切り替え（横から／上から）：図のすぐ上の右に（10/19 本人：操作の欄のいちばん下では気づかない） */
.viewsw { display: flex; justify-content: flex-end; align-items: center; margin: 2px 0 4px; }

.viewsw .seg { display: flex; flex: none; }
.viewsw em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--muted); margin-right: auto; white-space: nowrap; }
.viewsw .seg button { font: inherit; font-size: 12px; font-weight: 800; padding: 3px 12px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer; }
.viewsw .seg button:first-of-type { border-radius: 8px 0 0 8px; }
.viewsw .seg button:last-of-type { border-radius: 0 8px 8px 0; border-left: 0; }
.viewsw .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.viewsw .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* 緊締を試す：走り方が 6 つになったので 2 行に。真ん中は「戻す」と「タイヤ固縛を試す」を縦に */
.vmid { display: grid; gap: 6px; align-content: center; justify-items: stretch; }
[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">新人ノート ・ 荷扱い</div>
    <h1>積載車の荷扱い</h1>
    <p class="lead">2 段の積載車に、上段・下段の順で車を積むまでの流れです。図は助手席側（左）から見たところで、手順ごとに動きます。</p>
  </header>

  <div class="mode" role="tablist" aria-label="画面">
    <button class="tab" type="button" role="tab" id="modeSteps" aria-selected="true">手順</button>
    <button class="tab" type="button" role="tab" id="modeSim" aria-selected="false">緊締を試す</button>
    <button class="tab" type="button" role="tab" id="modeTire" aria-selected="false">タイヤ固縛</button>
  </div>

  <section class="panel stage" aria-label="トラックの図">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="simmsg" id="simMsg" hidden aria-live="polite"><p class="why" id="simWhy"></p><p class="res" id="simRes1"></p><p class="res" id="simRes2"></p></div>
    <div class="viewsw" id="simViewSw" role="group" aria-label="視点" hidden><em>緊締のところを押すと拡大</em><span class="vlabel">視点</span><span class="seg"><button type="button" id="simViewSide" aria-pressed="true">横から</button><button type="button" id="simViewTop" aria-pressed="false">上から</button></span></div>
    <svg class="diagram" id="truck" viewBox="0 110 2000 702" preserveAspectRatio="xMidYMid meet" role="img" aria-label="トラックを助手席側（左）から見た図。左が運転席、右が後ろ"></svg>
    <div class="ends" aria-hidden="true"><span>← 前（運転席）</span><span>後ろ →</span></div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="nav">
      <button class="btn" id="prev" type="button">← 前へ</button>
      <span class="count" id="count"></span>
      <button class="btn primary" id="next" type="button">次へ →</button>
    </div>
  </section>

  <section class="panel card" id="card" aria-live="polite"></section>
  <button class="more" type="button" id="more" hidden>↓ 下に続きがあります</button>
  <section class="panel compact" id="simControls" aria-label="緊締を試す" hidden>
    <!-- 上段の緊締・下段の緊締は左右にスワイプして切りかえる（本人 10/16） -->
    <div class="ltabs" role="tablist" aria-label="緊締する車"><button class="ltab" type="button" role="tab" id="ltabUp" aria-selected="true">上段の車</button><button class="ltab" type="button" role="tab" id="ltabLow" aria-selected="false">下段の車</button></div>
    <div class="lpages" id="lpages">
      <div class="lpage" aria-label="上段の車の緊締">
        <div class="lrow"><span class="lk">キャビン側</span><div class="chips" id="lashF"></div></div>
        <div class="lrow"><span class="lk">ゲート側</span><div class="chips" id="lashR"></div></div>
        <div class="lrow"><span class="lk">シフト</span><div class="chips" id="shiftUp"></div></div>
      </div>
      <div class="lpage" aria-label="下段の車の緊締">
        <div class="lrow"><span class="lk">下段</span><div class="chips"><button class="chip" type="button" id="lowToggle" aria-pressed="false">下段に車を積む</button></div></div>
        <div class="lrow lowrow" hidden><span class="lk">キャビン側</span><div class="chips" id="lashLF"></div></div>
        <div class="lrow lowrow" hidden><span class="lk">ゲート側</span><div class="chips" id="lashLR"></div></div>
        <div class="lrow lowrow" hidden><span class="lk">シフト</span><div class="chips" id="shiftLow"></div></div>
      </div>
    </div>
    <div class="lrow"><span class="lk">走る</span><div class="chips"><button class="chip" type="button" id="roadRough" aria-pressed="false">悪路</button><button class="chip ev" type="button" id="simBump">段差</button><button class="chip ev" type="button" id="simCurve">カーブ</button></div></div>
    <div class="lrow"><span class="lk">急な動き</span><div class="chips"><button class="chip ev" type="button" id="simAccel">急加速</button><button class="chip ev" type="button" id="simBrake">急ブレーキ</button><button class="chip ev bad" type="button" id="simCrash">衝突</button></div></div>
    <div class="vrow">
      <div class="vslider" id="vsF"><div class="vbox"><input type="range" id="simFront" min="0" max="100" value="50" aria-label="上段フロアのキャビン側の高さ"></div><span>キャビン側</span></div>
      <div class="vmid"><button class="btn" type="button" id="simAgain">車を元の位置に戻す</button><button class="btn" type="button" id="simToTire">タイヤ固縛を試す →</button></div>
      <div class="vslider" id="vsR"><div class="vbox"><input type="range" id="simRear" min="0" max="100" value="95" aria-label="上段フロアのゲート側の高さ"></div><span>ゲート側</span></div>
    </div>
  </section>
  <!-- タイヤ固縛を試す（2026-10-19）：上段・下段の車。見る＝横から（トラックの側面図）／上から（真上の図） -->
  <section class="panel tsim" id="tireSim" aria-label="タイヤ固縛を試す" hidden>
    <div class="simmsg" aria-live="polite"><p class="why" id="tWhy"></p><p class="res" id="tRes"></p><p class="res" id="tRes2"></p></div>
    <div class="viewsw" role="group" aria-label="視点"><button class="btn tsimbtn" type="button" id="tExplain">解説</button><em>固縛を押すと拡大</em><span class="vlabel">視点</span><span class="seg"><button type="button" id="tViewSide" aria-pressed="false">横から</button><button type="button" id="tViewTop" aria-pressed="true">上から</button></span></div>
    <div class="twin">
      <svg class="diagram" id="tTop" viewBox="60 50 1320 460" role="img" aria-label="積載車と車を上から見た図。左がキャビン側、右がゲート側"></svg>
      <svg class="diagram" id="tSide" viewBox="0 205 1480 607" role="img" aria-label="積載車を助手席側から見た図。左がキャビン側" hidden></svg>
    </div>
    <p class="tnote" id="tNote"></p>
  </section>
  <section class="panel compact" id="tireControls" aria-label="タイヤ固縛の操作" hidden>
    <div class="ltabs" role="tablist" aria-label="固縛する車"><button class="ltab" type="button" role="tab" id="tLtabUp" aria-selected="true">上段の車</button><button class="ltab" type="button" role="tab" id="tLtabLow" aria-selected="false">下段の車</button></div>
    <div class="lpages" id="tLpages">
      <div class="lpage" aria-label="上段の車の固縛">
        <div class="lrow"><span class="lk">固縛</span><div class="chips" id="tWheelsUp"></div></div>
        <div class="lrow"><span class="lk">ワイヤー</span><div class="chips"><button class="chip" type="button" id="tWireUp" aria-pressed="false">ワイヤーも掛ける（車体）</button></div></div>
      </div>
      <div class="lpage" aria-label="下段の車の固縛">
        <div class="lrow"><span class="lk">下段</span><div class="chips"><button class="chip" type="button" id="tLowToggle" aria-pressed="true">下段の車を下ろす</button><button class="chip tlowrow" type="button" id="tWireLow" aria-pressed="false">ワイヤーも掛ける</button></div></div>
        <div class="lrow tlowrow"><span class="lk">固縛</span><div class="chips" id="tWheelsLow"></div></div>
      </div>
    </div>
    <div class="lrow"><span class="lk">走る</span><div class="chips"><button class="chip ev" type="button" id="tBrake">急ブレーキ</button><button class="chip ev" type="button" id="tAccel">急加速</button><button class="chip ev" type="button" id="tCurve">カーブ</button><button class="chip ev" type="button" id="tBump">段差</button></div></div>
    <div class="demo"><button class="btn" type="button" id="tAgain">車を元の位置に戻す</button><button class="btn" type="button" id="tToWire">← ワイヤー緊締を試す</button></div>
  </section>
</div>

<script>
// 会社の積載車のイラスト（2026-10-16 本人）から、動かない部分だけを切り出して背景を透明にしたもの（art/cut.swift）
const BASE_IMG = 'nimotsu-truck.png';
// 本人の車の絵から切り出したプロボックス（右が前）とレクサス IS（左が前）（art/carcut2.swift）
const PROBOX_IMG = 'nimotsu-probox.png';
const IS_IMG = 'nimotsu-is.png';
// 真上から見た図（carrier-topview で作ったパーツ。2026-10-19 本人。1 m＝126 px の実寸、トラックの前の端が x=99・真ん中が y=258.5、どれも同じ 1418×517 の上に置く）
const TOP_TRUCK = 'nimotsu-top-truck.png', TOP_RAMPS = 'nimotsu-top-ramps.png', TOP_PROBOX = 'nimotsu-top-probox.png', TOP_IS = 'nimotsu-top-is.png';
// 絵は同じフォルダの PNG（2026-10-18 に HTML から分けた。ページを軽くするため）。先に読み込んでおく
for (const u of [BASE_IMG, PROBOX_IMG, IS_IMG, TOP_TRUCK, TOP_RAMPS, TOP_PROBOX, TOP_IS]) { const im = new Image(); im.src = u; }
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ── 手順 ──
  // 状態：sus（1=ふつう 0=全下げ）gate（0=格納 1=下ろす）plate（アルミ板）upF/upR（上段の前・後の高さ 0〜1）
  // up（上段の車 0=なし 1=積んだ。途中は走っている途中）low（下段の車）lowSlope（への字の斜めに載せる）pin（安全ピン）wU/wL（緊締）
  const base = { sus: 1, gate: 0, plate: 0, upF: 0, upR: 0, up: 0, low: 0, lowSlope: 0, pin: 0, wU: 0, wL: 0, pto: 0, clear: 0, height: 0, crash: 0, slide: 0, badWire: 0, slidePx: 0, hop: 0, lock: 1, slidePx2: 0, hop2: 0 };
  const PH = ['準備', '上段', '下段', '仕上げ'];
  const S = [
    { ph: 0, t: '作業灯をつける', where: '運転席', hi: 'cab', s: {},
      p: '荷扱いを始める前に、運転席で<b>作業灯</b>をつけます。作業灯と一緒に<b>ストロボ</b>も光るので、後ろから来る車に気付いてもらえて、<b>追突を防ぎます</b>。' },
    { ph: 0, t: 'PTO を入れる', where: '運転席', hi: 'cab', s: { pto: 1 },
      p: 'フロアを動かすには、運転席で <b>PTO スイッチを押して、クラッチを踏む</b>必要があります。' },
    { ph: 0, t: 'エアサスを全下げにする', where: '運転席', hi: 'cab', s: { pto: 1, sus: 0 },
      p: 'PTO を入れたら、そのまま<b>運転席のスイッチ</b>でエアサスを下げて、<b>後ろの車高</b>をいちばん下まで下げます。リアゲートの角度がゆるくなって、積み込みやすくなります。' },
    { ph: 0, t: '反時計回りでトラックの後ろへ', where: 'トラックのまわり', hi: null, s: { pto: 1, sus: 0 }, top: true,
      p: 'トラックを降りたら、基本は<b>反時計回り</b>（前を回って左側＝助手席側）で後ろへ行きます。運転席側は<b>車道側</b>なので、そこを歩かずに済むようにするためです。下の図は上から見たところです。' },
    { ph: 0, t: 'ゲートロックを左右とも外す', where: 'トラックの後ろ', hi: 'lock', s: { pto: 1, sus: 0, lock: 0 },
      p: 'リアゲートのロックを、<b>左右とも</b>外します。' },
    { ph: 0, t: 'リアゲート（道板）を下ろす', where: '左後ろ・下段フロアの下のスイッチ', hi: 'gsw', s: { pto: 1, sus: 0, gate: 1 },
      p: '左後ろ・下段フロアの下のスイッチで、リアゲートを地面まで下ろします。' },
    { ph: 0, t: '先端のアルミ板を広げる', where: 'リアゲートの先', hi: 'plate', s: { pto: 1, sus: 0, gate: 1, plate: 1 },
      p: 'リアゲートの先にたたんで載っている<b>アルミ板 2 枚</b>を、手で起こして先へ広げます。地面との段差がなくなります。' },

    { ph: 1, t: '落とし込み幅・輪止めの位置を確かめる', where: '上段フロア', hi: 'chockU', s: { pto: 1, sus: 0, gate: 1, plate: 1 },
      p: '積む車に合わせて、上段フロアの<b>落とし込み幅</b>か<b>輪止めの位置</b>を確かめます。' },
    { ph: 1, t: '上段に車を積む', where: '上段フロア', hi: null, s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1 }, drive: 'up',
      p: '<b>バック</b>で、道板から下段フロアを通って上段フロアへゆっくり上がります。車の前は後ろ（道板側）を向いたままです。' },
    { ph: 1, t: '上段を前後とも少しずつ上げる', where: '助手席側・キャビンの後ろのフロア操作スイッチ', hi: 'fsw', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .5, upR: .6 }, seq: true,
      p: '上段フロアは前と後ろの油圧シリンダーで角度を変えられます。<b>後ろから、前と後ろを交互に少しずつ</b>上げます。',
      warn: ['後ろだけ上げない', '後ろだけ上げると、上段の車が前に傾いて<b>キャビンに当たります</b>。下の「後ろだけ上げると？」で見られます。'],
      tip: '全部上げると、緊締のときに手が届かなくなることがあります。高さは自分の届くところで止めます。' },
    { ph: 1, t: '安全ピンを挿す', where: '上段フロアの柱と油圧シリンダー', hi: 'pins', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .5, upR: .6, pin: 1 },
      p: 'もしものときにフロアが落ちないよう、上げたら<b>安全ピン</b>を挿します。前の<b>柱の穴</b>と後ろの<b>油圧シリンダー</b>に、それぞれ<b>左右</b>。<b>前後左右の 4 か所</b>です（図は助手席側から見ているので、前と後ろの 2 か所だけ見えます）。' },
    { ph: 1, t: '上段の車を 4 か所で緊締する', where: '下段フロアに上がって', hi: 'wireU', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .5, upR: .6, pin: 1, wU: 1 },
      p: 'フロアに張ってあるワイヤーのフックを、車の穴（鉄板が二重の専用の穴）やフック用のプレートに掛けて、手動の巻き取り機（<b>ガッチャ</b>）で張ります。',
      tip: '上段は走るときにキャビン側を下げて傾けるので、車はキャビン側へ下がろうとします。ゲート側の車輪はフックを車輪より<b>ゲート側（後ろ）</b>に掛けて後ろへ引き、キャビン側の車輪は<b>真下引き</b>にします。上の「緊締を試す」でも確かめられます。' },

    { ph: 2, t: '上段を最大まで上げて、安全ピンを挿す', where: 'フロア操作スイッチ', hi: 'pins', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: 1, upR: 1, pin: 1, wU: 1 },
      p: '下段に積む前に、上段フロアを最大まで上げて安全ピン（柱の穴と油圧シリンダーの<b>前後左右 4 か所</b>）を挿し、下段の輪止めの位置を確かめます。' },
    { ph: 2, t: 'すき間が厳しい車は、前を中くらいに', where: 'フロア操作スイッチ', hi: 'fsw', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .45, upR: 1, pin: 1, wU: 1 },
      p: '車種によっては上段フロアとのすき間が厳しいので、<b>前を中くらい・後ろを全上げ</b>などにして、すき間を作ります。' },
    { ph: 2, t: '下段に車を積む', where: '下段フロア', hi: null, s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .45, upR: 1, pin: 1, wU: 1, low: 1 }, drive: 'low',
      p: '道板から下段フロアへ、ゆっくり積み込みます。' },
    { ph: 2, t: '「への字」の斜めに載せるとき', where: '下段フロアの後ろ', hi: 'slope', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .45, upR: 1, pin: 1, wU: 1, low: 1, lowSlope: 1 },
      p: '下段フロアは、前が平らで後ろが下がる「への字」です。車は後ろ寄りに載せるので、後ろの車輪は<b>斜めの部分</b>に乗ります。軽自動車などは全部が斜めに載ってもゲートが閉まります。',
      warn: ['ニュートラルだと下がる坂', '斜めに載せたときは、後ろに下がる力を考えて緊締するか、<b>後ろにも輪止め</b>をします。ゲートを閉めて走ったとき、下がって当たらないようにします。'] },
    { ph: 2, t: '上段の高さを決めて、ピンを差し直す', where: '上段フロア', hi: 'clear', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .5, upR: .95, pin: 1, wU: 1, low: 1, clear: 1 },
      p: '下段の車とのすき間を見て上段フロアの固定位置を決め、安全ピンを差し直します。跳ねても当たらないすき間をとります。背の高い車のときは、<b>キャビン側をもっと下げて</b>上段を傾け、全体の高さを抑えます。',
      tip: '傾きがきつくなるぶん、上段の車はキャビン側へ下がろうとします。緊締がゲート側へ引いていれば止まります。下のボタンで、前へ引いていた場合と比べられます。', wireDemo: true,
      warn: ['下段のワイヤーより先に', 'ワイヤーを巻いたあとで上段を下げると、ワイヤーが切れたときに下段の車が跳ね上がって<b>上段フロアに当たる</b>ことがあります。'] },
    { ph: 2, t: '下段の車を緊締する', where: '下段フロア', hi: 'wireL', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .5, upR: .95, pin: 1, wU: 1, low: 1, wL: 1 },
      p: '重さと、力がかかる向きを考えて、しっかり張ります。' },

    { ph: 3, t: '荷姿の高さを確かめる', where: 'トラックの横から', hi: 'height', s: { pto: 1, sus: 0, gate: 1, plate: 1, up: 1, upF: .5, upR: .95, pin: 1, wU: 1, low: 1, wL: 1, height: 1 },
      p: '上下に重ねるので、車種によって高さが変わります。<b>自分の荷姿の高さ</b>を知っておきます。',
      warn: ['高さ制限', '道路の高さの上限はふつう 3.8m（高さ指定道路は 4.1m）。ガード下や高さ制限のある道で当たらないようにします。'] },
    { ph: 3, t: '確かめて、アルミ板とリアゲートをしまう', where: 'トラックの後ろ', hi: 'gsw', s: { pto: 1, sus: 0, up: 1, upF: .5, upR: .95, pin: 1, wU: 1, low: 1, wL: 1, lock: 1 },
      seqStates: [{ plate: 0 }, { gate: 0 }, { lock: 1 }],
      p: '安全ピンと緊締の忘れがないか確かめてから、<b>先にアルミ板をたたみ</b>、それからリアゲートを立てて格納し、ゲートロックを左右かけます。' },
    { ph: 3, t: 'エアサスを戻して、PTO を切り、作業灯を消す', where: '運転席', hi: 'cab', s: { sus: 1, up: 1, upF: .5, upR: .95, pin: 1, wU: 1, low: 1, wL: 1 },
      p: '運転席に戻ったら、エアサスを通常の高さに戻し、PTO を解除して、<b>作業灯を消します</b>（ストロボも一緒に消えます）。これで荷扱いは終わりです。' },
  ];

    for (const key of tKeys()) {

      // ワイヤー（車体の 4 か所からフロアへ。フロアのフックは動かない）
      if (tWire[key]) for (const [sx, sy] of [[-1, 1], [-1, -1], [1, 1], [1, -1]]) {
        const lx = sx * (P.hl - .45), ly = sy * (P.hw - .07), h = TP(P.rest.x + sx * (P.hl - .05), P.rest.y + sy * (P.hw + .15));
        el('line', { x1: p.c.x + (lx * p.cs - ly * p.sn) * TPX, y1: p.c.y + (lx * p.sn + ly * p.cs) * TPX, x2: h.x, y2: h.y, stroke: wire, 'stroke-width': 7, 'stroke-linecap': 'round' }, top);
        el('circle', { cx: h.x, cy: h.y, r: 7, fill: wire }, top);
      }
      // 車輪は車体の下（下段の前は上段の道板の下）に隠れているので、場所が分かるように重ねて描く
      const wg = el('g', { transform: `translate(${p.c.x.toFixed(1)},${p.c.y.toFixed(1)}) rotate(${p.deg.toFixed(2)})` }, top);
      for (const k of TWH) { const [lx, ly] = twp(P, k); el('rect', { x: lx * TPX - 40, y: ly * TPX - 14, width: 80, height: 28, rx: 8, fill: TC.tire, opacity: .85, stroke: '#FFFFFF', 'stroke-width': 2 }, wg); }
      // 固縛した車輪：Ω のベルト（上から見ると、タイヤの上を前後に通る帯）と、ラチェット。締める向きは内向き（キャビン側の車輪はゲート側へ、ゲート側の車輪はキャビン側へ）
      for (const k of TWH) if (tSel[key].has(k)) {
        const [lx, ly] = twp(P, k), d = lx < 0 ? 1 : -1;
        const q = tWheel(P, B, k), w = TP(P.rest.x + lx + q.x, P.rest.y + ly + q.y), a = TP(P.rest.x + lx, P.rest.y + ly);
        el('path', { d: `M${a.x - d * 88},${a.y} L${w.x},${w.y} L${a.x + d * 177},${a.y}`, fill: 'none', stroke: TC.belt, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, top);
        el('rect', { x: a.x + d * 140 - 14, y: a.y - 10, width: 28, height: 20, rx: 4, fill: TC.metal, stroke: TC.metalD, 'stroke-width': 2 }, top);
        for (const hx of [a.x - d * 88, a.x - 23, a.x + 23, a.x + d * 177]) el('circle', { cx: hx, cy: a.y, r: 6, fill: TC.metalD }, top);
        el('circle', { cx: w.x, cy: w.y, r: 50, fill: 'none', stroke: acc, 'stroke-width': 6, 'stroke-dasharray': '13 9' }, top);
        zoomTap(top, w.x, w.y, 56, `${P.name}・${TNAME[k]}の固縛`, 'top', w.x + d * 50, (w.y + p.c.y) / 2);
      }
      const tag = el('text', { x: p.c.x, y: p.c.y + 12, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 900, fill: '#141A12', stroke: '#FFFFFF', 'stroke-width': 8, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, top); tag.textContent = P.name;
      if (B.hit) { const h = TP(B.hit.x, B.hit.y); el('circle', { cx: h.x, cy: h.y, r: 44, fill: 'none', stroke: bad, 'stroke-width': 10 }, top); }
    }
  }
  // ── 横から見た図：手順と同じトラックの側面図（緊締を試すと同じ高さ）に 2 台。ボディとタイヤを分けて動かし、見えている側の固縛を描く ──
  function tDrawSide(target = document.getElementById('tSide')) {
    const S = tState, keep = cur, keepW = lastWheels, prevP = carP;
    const lift = key => { const B = S.cars[key]; return (TWH.reduce((a, k) => a + B.hop[k][0], 0) / 4 + B.bz) * PXM * T_GAIN; };
    tSideOn = {};
    for (const key of tKeys()) tSideOn[key] = { lift: lift(key), hops: TSIDE_KEYS[key].map(k => S.cars[key].hop[k][0] * PXM * T_GAIN) };
    cur = { ...base, pto: 1, up: 1, pin: 1, upF: simF, upR: simR, low: tLowOn ? 1 : 0, slidePx: S.cars.up.x * PXM, slidePx2: tLowOn ? S.cars.low.x * PXM : 0 };
    carP = { up: 1, low: 1 };
    renderTarget = target;
    try { render(); } finally { renderTarget = null; tSideOn = null; cur = keep; lastWheels = keepW; carP = prevP; }
  }
  // 横から見た図に、見えている側の車輪のタイヤ固縛と、ワイヤー（車体）を描く（render の中から呼ぶ）
  function tireSideMarks(svg, g, upCar, lowCar) {
    for (const [key, carObj, ft, off] of [['up', upCar, 9, -5], ['low', lowCar, 11, 4]]) {
      if (!carObj) continue;
      const ws = carObj.wheels.slice().sort((a, b) => a.x - b.x);
      ws.forEach((w, i) => { const k = TSIDE_KEYS[key][i]; if (tSel[key].has(k)) { tireStrap(svg, w, carObj.rPx, carObj.ang, i === 0 ? 1 : -1, { ft, floor: carObj.rPx + off }); zoomTap(svg, w.x, w.y, 42, `${TCARS[key].name}・${TNAME[k]}の固縛`, 'side', w.x + (i === 0 ? 1 : -1) * carObj.rPx * 1.1); } });
      if (tWire[key]) wires(svg, carObj.hooks, key === 'up' ? (x => onDeck(g, clamp((x - g.deck.x1) / (g.deck.x2 - g.deck.x1), 0, 1))) : (x => ({ x, y: lowerFloorY(x, g) })), HOOK.down, HOOK.down);
    }
  }
  function tSetView(v) {
    tView = v; closeZoom();
    document.getElementById('tTop').toggleAttribute('hidden', v !== 'top'); document.getElementById('tSide').toggleAttribute('hidden', v !== 'side');   // SVG は .hidden が効かないので属性で
    for (const [id, k] of [['tViewSide', 'side'], ['tViewTop', 'top']]) document.getElementById(id).setAttribute('aria-pressed', v === k ? 'true' : 'false');
  }
  function tChips() {
    for (const [key, id] of [['up', 'tWheelsUp'], ['low', 'tWheelsLow']]) {
      const box = document.getElementById(id), sel = tSel[key];
      const mark = () => [...box.children].forEach((b, i) => { const k = [...TWH, 'none'][i]; b.setAttribute('aria-pressed', (k === 'none' ? !sel.size : sel.has(k)) ? 'true' : 'false'); });
      for (const k of [...TWH, 'none']) {
        const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = k === 'none' ? 'なし' : TNAME[k];
        b.onclick = () => { if (k === 'none') sel.clear(); else if (sel.has(k)) sel.delete(k); else sel.add(k); mark(); tTouched(); };
        box.appendChild(b);
      }
      mark();
    }
    for (const [key, id] of [['up', 'tWireUp'], ['low', 'tWireLow']]) { const wb = document.getElementById(id); wb.onclick = () => { tWire[key] = !tWire[key]; wb.setAttribute('aria-pressed', tWire[key] ? 'true' : 'false'); tTouched(); }; }
    const lt = document.getElementById('tLowToggle');
    const showLow = () => { lt.setAttribute('aria-pressed', tLowOn ? 'true' : 'false'); lt.textContent = tLowOn ? '下段の車を下ろす' : '下段に車を積む'; for (const r of document.querySelectorAll('.tlowrow')) r.hidden = !tLowOn; };
    lt.onclick = () => { tLowOn = !tLowOn; if (tState) tState.cars.low = tBody(); showLow(); tTouched(); };
    showLow();
    // 上段・下段のタブ：押すか、左右にスワイプして切りかえる（緊締を試すと同じ）
    { const pages = document.getElementById('tLpages'), tabs = [document.getElementById('tLtabUp'), document.getElementById('tLtabLow')];
      const mark = i => { tabs.forEach((t, k) => t.setAttribute('aria-selected', k === i ? 'true' : 'false')); const nt = i ? 'low' : 'up'; if (nt !== tTab) { tTab = nt; tNote(); } };
      tabs.forEach((t, i) => t.onclick = () => { pages.scrollTo({ left: i * pages.clientWidth, behavior: 'smooth' }); mark(i); });
      pages.addEventListener('scroll', () => mark(Math.round(pages.scrollLeft / Math.max(1, pages.clientWidth)))); }
    document.getElementById('tViewSide').onclick = () => tSetView('side');
    document.getElementById('tViewTop').onclick = () => tSetView('top');
    tSetView(tView);
    for (const [id, k] of [['tBrake', 'brake'], ['tAccel', 'accel'], ['tCurve', 'curve'], ['tBump', 'bump']]) document.getElementById(id).onclick = () => tEvent(k);
    document.getElementById('tAgain').onclick = tStart;
    document.getElementById('tExplain').onclick = openTireExplain;
    document.getElementById('tToWire').onclick = () => setMode('sim');
    document.getElementById('simToTire').onclick = () => setMode('tire');
    tNote();
  }
  function tNote() { document.getElementById('tNote').innerHTML = tNoteHtml(); }
  // かけ方を変えたら、終わった試しの結果は消して、いまのかけ方の説明に
  function tTouched() { tNote(); if (tState && tState.ev && tState.ev.done) tState.ev = null; }
  tChips();

  // ── 緊締を試す：上から見た図（見る＝上から）。真上の図のトラックに 2 台、選んだ緊締のワイヤーの向きも描く ──
  let simTop = false;
  const SIM_VB = { side: '0 205 1480 607', top: '60 50 1320 460' };
  function drawSimTop(svg) {
    const st = simState, C = { muted: css('--muted'), wire: css('--wire'), bad: css('--danger') };
    el('image', { href: TOP_TRUCK, x: 0, y: 0, width: 1418, height: 517 }, svg);
    if (svg.id !== 'zoomSvg') {   // 拡大の中では図の説明の文字は描かない
      for (const [x, a, s2] of [[110, 'start', '← キャビン側（前）'], [1350, 'end', 'ゲート側 →']]) { const e = el('text', { x, y: 96, 'text-anchor': a, 'font-size': 40, 'font-weight': 800, fill: C.muted }, svg); e.textContent = s2; }
      { const e = el('text', { x: 720, y: 498, 'text-anchor': 'middle', 'font-size': 32, 'font-weight': 700, fill: C.muted }, svg); e.textContent = '上から見た図（図の下が助手席側。ずれは実寸）'; }
    }
    if (!st) return;
    // 車のずれ：前後は b.x（キャビン側が＋）、横は両端（キャビン側の端 c・ゲート側の端 g、外側＝図の上が＋）
    const pose = (key, b) => { const P = TCARS[key], dy = -(b.lat.c + b.lat.g) / 2, th = Math.atan2(b.lat.c - b.lat.g, P.hl * 2); return { P, c: TP(P.rest.x - b.x, P.rest.y + dy), th, cs: Math.cos(th), sn: Math.sin(th) }; };
    const draw = (key, b) => { const p = pose(key, b), [img, , , w, h] = p.P.img; const g = el('g', { transform: `translate(${p.c.x.toFixed(1)},${p.c.y.toFixed(1)}) rotate(${(p.th * 180 / Math.PI).toFixed(2)})` }, svg); el('image', { href: img, x: -w / 2, y: -h / 2, width: w, height: h }, g); };
    if (lowOn) draw('low', st.low);
    el('image', { href: TOP_RAMPS, x: 0, y: 0, width: 1418, height: 517 }, svg);
    draw('up', st.up);
    // ワイヤー：車の 4 か所（キャビン側・ゲート側の左右）のフックから、選んだ向きのフロアの 2 か所へ（真下＝前後に開く、前引＝キャビン側へ、後ろ引＝ゲート側へ）
    for (const [key, b, ks] of [['up', st.up, [lash.F, lash.R]], ['low', lowOn ? st.low : null, [lash.LF, lash.LR]]]) {
      if (!b) continue;
      const p = pose(key, b);
      ks.forEach((k, e) => {
        for (const sy of [-1, 1]) {
          const lx = (e ? 1 : -1) * (p.P.wb / 2 - .35), ly = sy * (p.P.hw - .15);
          const hk = { x: p.c.x + (lx * p.cs - ly * p.sn) * TPX, y: p.c.y + (lx * p.sn + ly * p.cs) * TPX };
          for (const off of HOOK[k]) {
            const a = TP(p.P.rest.x + lx + off / PXM, p.P.rest.y + sy * (p.P.hw + .1));
            el('line', { x1: hk.x, y1: hk.y, x2: a.x, y2: a.y, stroke: C.wire, 'stroke-width': 6, 'stroke-linecap': 'round' }, svg);
            el('circle', { cx: a.x, cy: a.y, r: 7, fill: C.wire }, svg);
          }
          if (k !== 'none') zoomTap(svg, hk.x, hk.y, 48, `${TCARS[key].name}・${e ? 'ゲート' : 'キャビン'}側の緊締`, 'top', hk.x, (hk.y + p.c.y) / 2);
        }
      });
      const tag = el('text', { x: p.c.x, y: p.c.y + 12, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 900, fill: '#141A12', stroke: '#FFFFFF', 'stroke-width': 8, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, svg); tag.textContent = TCARS[key].name;
      if (b.hit) el('circle', { cx: p.c.x + (b.hit === 'gate' || b.hit === 'derail' ? 1 : -1) * p.P.hl * TPX, cy: p.c.y, r: 46, fill: 'none', stroke: C.bad, 'stroke-width': 10 }, svg);
    }
  }
  function setSimView(v) {
    simTop = v === 'top'; closeZoom();
    for (const [id, k] of [['simViewSide', 'side'], ['simViewTop', 'top']]) document.getElementById(id).setAttribute('aria-pressed', v === k ? 'true' : 'false');
    if (simMode) document.getElementById('truck').setAttribute('viewBox', SIM_VB[v]);
  }
  document.getElementById('simViewSide').onclick = () => setSimView('side');
  document.getElementById('simViewTop').onclick = () => setSimView('top');
  setSimView('side');

  go(0);

  // ── 下に続きがあるときの知らせ ──
  const more = document.getElementById('more');
  function updateMore() {
    const card = document.getElementById('card');
    const hidden = document.body.classList.contains('simmode') || document.body.classList.contains('tiremode') || card.hidden || card.getBoundingClientRect().bottom <= innerHeight - 8;
    more.hidden = hidden;
  }
  more.onclick = () => { const r = document.getElementById('card').getBoundingClientRect(); scrollBy({ top: r.bottom - innerHeight + 24, behavior: reduce ? 'auto' : 'smooth' }); };
  addEventListener('scroll', updateMore, { passive: true });
  addEventListener('resize', updateMore);
  new ResizeObserver(updateMore).observe(document.getElementById('card'));
  updateMore();
  // 手順と「緊締を試す」の切り替え（上下に並べると見にくいので別の画面に）
  function setMode(m) {
    const simOn = m === 'sim', tireOn = m === 'tire';
    simMode = simOn;
    closeZoom(); closeTireExplain();
    document.getElementById('modeSteps').setAttribute('aria-selected', m === 'steps' ? 'true' : 'false');
    document.getElementById('modeSim').setAttribute('aria-selected', simOn ? 'true' : 'false');
    document.getElementById('modeTire').setAttribute('aria-selected', tireOn ? 'true' : 'false');
    for (const id of ['tireSim', 'tireControls']) document.getElementById(id).hidden = !tireOn;
    document.body.classList.toggle('tiremode', tireOn);
    if (tireOn) { cancelAnimationFrame(simAnim); simState = null; simView = null; document.getElementById('simControls').hidden = true; document.body.classList.remove('simmode'); tStart(); }
    else tStop();
    if (tireOn) { if (!document.body.classList.contains('fixedpage')) { try { localStorage.setItem('nimotsu.mode', m); } catch (e) {} } return; }
    for (const id of ['card', 'tabs']) document.getElementById(id).hidden = simOn;
    document.getElementById('simMsg').hidden = !simOn;
    document.getElementById('simViewSw').hidden = !simOn;
    document.getElementById('truck').setAttribute('viewBox', simOn ? SIM_VB[simTop ? 'top' : 'side'] : '0 110 2000 702');
    document.querySelector('.stage .progress').hidden = simOn;
    document.querySelector('.stage .nav').hidden = simOn;
    document.getElementById('simControls').hidden = !simOn;
    document.body.classList.toggle('simmode', simOn);
    if (simOn) resetSim(); else { cancelAnimationFrame(simAnim); simState = null; simView = null; go(idx); }
    if (!document.body.classList.contains('fixedpage')) { try { localStorage.setItem('nimotsu.mode', m); } catch (e) {} }
  }
  document.getElementById('modeSteps').onclick = () => setMode('steps');
  document.getElementById('modeSim').onclick = () => setMode('sim');
  document.getElementById('modeTire').onclick = () => setMode('tire');
  // アプリに入れるときは、ページごとに決め打ち（<meta name="kyoei-page" content="steps|sim">）。切り替えと見出しは出さない
  const fixedPage = document.querySelector('meta[name="kyoei-page"]')?.content;
  if (fixedPage) { document.querySelector('.mode').hidden = true; document.body.classList.add('fixedpage'); setMode(fixedPage); }
  else { try { const sm = localStorage.getItem('nimotsu.mode'); if (sm === 'sim' || sm === 'tire') setMode(sm); } catch (e) {} }
  // 縦スライダーは空いている高さいっぱいの長さに（下段の行が増えると短くなる）
  { const fit = () => { for (const id of ['simFront', 'simRear']) { const box = document.getElementById(id).parentElement; const h = box.getBoundingClientRect().height; if (h > 0) box.style.setProperty('--vlen', Math.round(h) + 'px'); } };
    try { const ro = new ResizeObserver(fit); for (const id of ['simFront', 'simRear']) ro.observe(document.getElementById(id).parentElement); } catch (e) {} addEventListener('resize', fit); setTimeout(fit, 50); }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
